<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AoD Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <img id="hero-img" src="img/ch06-header.jpg" alt="">
  <div class="hero-text">
    <div class="eyebrow" id="hero-eyebrow">Campaign companion · Beta</div>
    <h1 id="hero-title">AoD Game Night<span>Narrated adventures</span></h1>
  </div>
</header>

<!-- HOME -->
<main id="home" class="hidden">
  <section class="lookup-box" id="lookup">
    <div class="search">
      <span class="search-ico">⌕</span>
      <input id="q" type="search" placeholder="Rules lookup: burn, focus, falling, companion…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="cats" id="cats"></div>
    <div class="results" id="results"></div>
  </section>
  <h2 class="section-title">Adventures</h2>
  <div class="parts" id="parts"></div>
</main>

<!-- PART -->
<div id="part" class="hidden">
  <nav class="tabs" role="tablist">
    <a class="tab-home" href="./" title="All parts">☰</a>
    <button data-tab="story">Story</button>
    <button data-tab="setup">Setup &amp; Rules</button>
    <button data-tab="play">Play</button>
    <button data-tab="ending">Ending</button>
  </nav>
  <main>
    <section id="tab-story" class="tab"></section>
    <section id="tab-setup" class="tab"></section>
    <section id="tab-play" class="tab"></section>
    <section id="tab-ending" class="tab"></section>
  </main>
</div>

<!-- Player bar -->
<div class="player hidden" id="player">
  <div class="now">
    <span class="who" id="now-who">Ready</span>
    <span class="what" id="now-what">Press ▶ on any scene, or tap a line to start from there.</span>
  </div>
  <div class="controls">
    <button class="icon" id="p-prev" title="Previous line">⏮</button>
    <button class="icon big" id="p-play" title="Play / pause (space)">▶</button>
    <button class="icon" id="p-next" title="Next line">⏭</button>
    <button class="icon" id="p-stop" title="Stop">■</button>
    <button class="icon" id="p-settings" title="Settings">⚙</button>
  </div>
  <div class="settings hidden" id="settings">
    <label>Speed <select id="s-speed">
      <option value="0.85">0.85×</option><option value="0.95">0.95×</option>
      <option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option>
    </select></label>
    <label>Voice volume <input type="range" id="s-voice" min="0" max="1" step="0.05" value="1"></label>
    <label class="check"><input type="checkbox" id="s-rules"> Also read rule text aloud</label>
    <label class="check"><input type="checkbox" id="s-amb"> Dungeon ambience</label>
    <label>Ambience volume <input type="range" id="s-ambvol" min="0" max="1" step="0.05" value="0.5"></label>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="zoom hidden" id="zoom"><img alt=""></div>

<script src="data/parts.js"></script>
<script src="app.js"></script>
</body>
</html>
